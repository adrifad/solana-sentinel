# Non-secret baseline. All live transaction capabilities are intentionally absent.
version: 1
network: mainnet-beta
mode: DRY_RUN

providers:
  helius:
    request_timeout_ms: 3000
    max_requests_per_second: 5
    max_requests_per_utc_day: 1000
    exit_reserved_requests_per_utc_day: 200
    max_concurrent_enrichments: 4
    enable_trade_stream: false
    max_active_trade_subscriptions: 20
    max_trade_events_per_day: 5000
    trade_verification_concurrency: 2
    max_pending_trade_verifications: 128
  pumpportal:
    enable_new_tokens: true
    enable_migrations: true
    enable_token_trades: false
    max_monitored_tokens: 20
    max_trade_events_per_day: 5000
    max_active_trade_subscriptions: 20
    observation_window_seconds: 60
    monitoring_duration_seconds: 120
    event_processing_concurrency: 4
    max_pending_events: 128
  dexscreener:
    enabled: false # no adapter is active in this implementation slice
    requests_per_second: 2
  jupiter:
    enabled: false
    request_timeout_ms: 3000
    max_requests_per_second: 1
    max_requests_per_utc_day: 500
    max_quote_age_ms: 1500

analysis:
  concurrent_token_analysis: 6
  creator_history_cache_ttl_seconds: 3600
  creator_history_max_transactions: 200
  creator_history_page_size: 50
  creator_tracing_max_depth: 2
  suspicious_launch_count: 3
  suspicious_launch_window_seconds: 3600
  max_analysis_ms: 10000
  token_observation_seconds: 60
  min_independent_buyers: 3
  min_holder_sample_coverage_bps: 9000
  social_enabled: false

security:
  require_fresh_mint_state: true
  unknown_policy: QUARANTINE
  test_token_policy: QUARANTINE
  reject_untrusted_permanent_delegate: true
  reject_unsafe_mint_authority: true
  reject_unsafe_freeze_authority: true
  reject_unsupported_transfer_hooks: true
  require_sell_quote_for_buy: true
  max_snapshot_age_ms: 1500
  max_holder_accounts: 10
  max_snapshot_slot_skew: 32

strategy:
  entry_mode: VALIDATED
  min_opportunity_score: 80
  weights:
    creator_history: 30
    token_security: 25
    launch_behavior: 20
    exit_liquidity: 15
    social_confidence: 10
  min_independent_buyers: 3
  max_signal_age_ms: 3000
  max_hold_seconds: 900

risk:
  max_trade_sol: '0.05'
  max_exposure_sol: '0.20'
  max_open_positions: 3
  max_daily_loss_sol: '0.10'
  max_drawdown_bps: 500
  max_price_impact_bps: 300
  max_slippage_bps: 200
  emergency_pause: false

paper:
  initial_sol: '10.0'
  execution_latency_ms: 750
  max_quote_age_ms: 1000
  conservative_extra_slippage_bps: 50
  modeled_network_fee_lamports: '10000'
  mark_to_sell_quote: true
  reject_when_sell_quote_missing: true
  wallet_id: sentinel-paper-default
  automatic_entries_enabled: false
  manual_entry_request_expiry_ms: 5000
  manual_exit_request_expiry_ms: 300000
  order_size_sol: '0.01'
  stop_loss_bps: 1500
  take_profit_bps: 3000
  position_monitor_interval_ms: 15000
  position_monitor_max_interval_ms: 900000
  position_monitor_estimated_rpc_requests: 2
  exit_retry_base_ms: 5000
  exit_retry_max_ms: 300000

observability:
  timezone_display: Asia/Jakarta
  raw_event_retention_days: 14
  decision_retention_days: 180
  health_stale_feed_seconds: 30
  audit_config_changes: true
